services:
  # ===== PostgreSQL + PGVector =====
  postgres:
    image: pgvector/pgvector:pg16
    container_name: infopilot-postgres
    environment:
      POSTGRES_USER: infopilot
      POSTGRES_PASSWORD: infopilot
      POSTGRES_DB: infopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: infopilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== InfoPilot 服务 =====
  app:
    image: ghcr.io/spojchil/infopilot:latest
    build: .
    container_name: infopilot-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/infopilot
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
