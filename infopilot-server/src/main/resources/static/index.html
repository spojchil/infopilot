<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoPilot - 企业文档智能助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1a5276; color: #fff; padding: 12px 20px; font-size: 18px; font-weight: bold; }
        header span { font-size: 12px; opacity: .7; margin-left: 8px; }
        #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 8px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .msg.user { align-self: flex-end; background: #1a5276; color: #fff; }
        .msg.assistant { align-self: flex-start; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .msg.assistant.streaming { border-left: 2px solid #1a5276; }
        footer { background: #fff; padding: 12px 16px; display: flex; gap: 8px; border-top: 1px solid #e0e0e0; }
        #input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; resize: none; font-family: inherit; }
        #input:focus { outline: none; border-color: #1a5276; }
        button { padding: 10px 20px; background: #1a5276; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        #status { text-align: center; font-size: 12px; color: #999; padding: 4px; }
    </style>
</head>
<body>
    <header>InfoPilot <span>企业文档智能助手</span></header>
    <div id="messages"></div>
    <div id="status">就绪</div>
    <footer>
        <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button id="btn" onclick="send()">发送</button>
    </footer>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const btnEl = document.getElementById('btn');
const statusEl = document.getElementById('status');

// 生成会话 ID，同一浏览器窗口内复用
let sessionId = sessionStorage.getItem('infopilot-sid') || crypto.randomUUID();
sessionStorage.setItem('infopilot-sid', sessionId);

function addMsg(role, text, cls = '') {
    const div = document.createElement('div');
    div.className = `msg ${role} ${cls}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
}

async function send() {
    const msg = inputEl.value.trim();
    if (!msg) return;

    inputEl.value = '';
    inputEl.disabled = btnEl.disabled = true;
    statusEl.textContent = '思考中...';

    addMsg('user', msg);
    // 流式
    const assistantDiv = addMsg('assistant', '', 'streaming');

    try {
        const resp = await fetch(`/api/chat/stream?sessionId=${encodeURIComponent(sessionId)}&message=${encodeURIComponent(msg)}`);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            // 解析 SSE: "data:xxx\n\n"
            const lines = buffer.split('\n\n');
            buffer = lines.pop(); // 保留不完整的最后一段

            for (const line of lines) {
                const dataLines = line.split('\n').filter(l => l.startsWith('data:'));
                for (const dl of dataLines) {
                    assistantDiv.textContent += dl.slice(5);
                }
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        assistantDiv.classList.remove('streaming');
        if (!assistantDiv.textContent) assistantDiv.textContent = '(空响应)';
        statusEl.textContent = '就绪';
    } catch (e) {
        assistantDiv.textContent = '错误: ' + e.message;
        statusEl.textContent = '请求失败';
    }

    inputEl.disabled = btnEl.disabled = false;
    inputEl.focus();
}
</script>
</body>
</html>
