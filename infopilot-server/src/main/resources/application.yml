spring:
  application:
    name: infopilot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/infopilot}
    username: ${DB_USERNAME:infopilot}
    password: ${DB_PASSWORD:infopilot}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  type-aliases-package: io.github.spojchil.infopilot.server.model.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: "now()"
      logic-not-delete-value: "0"

infopilot:
  chat:
    base-url: ${CHAT_BASE_URL}
    api-key: ${CHAT_API_KEY}
    model-name: ${CHAT_MODEL}

  embedding:
    base-url: ${EMBEDDING_BASE_URL}
    api-key: ${EMBEDDING_API_KEY}
    model-name: ${EMBEDDING_MODEL:embedding-3}

  vector-store:
    host: ${VECTOR_STORE_HOST:localhost}
    port: ${VECTOR_STORE_PORT:5432}
    database: ${VECTOR_STORE_DATABASE:infopilot}
    username: ${DB_USERNAME:infopilot}
    password: ${DB_PASSWORD:infopilot}
    table: embeddings
    dimension: 2048

server:
  port: ${SERVER_PORT:8080}
