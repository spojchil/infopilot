server:
  port: 8080

spring:
  application:
    name: infopilot

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/infopilot
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

# MyBatis-Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# LangChain4j 日志（开发阶段开启）
logging:
  level:
    dev.langchain4j: DEBUG
