server:
  port: 8080

spring:
  application:
    name: infopilot

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/infopilot
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: "123456"

# MyBatis-Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ==================== LangChain4j 配置 ====================
infopilot:
  # DeepSeek 对话模型
  deepseek:
    api-key: ${DEEPSEEKJEECG}
    base-url: https://api.deepseek.com/v1
    model-name: deepseek-v4-flash
    temperature: 0.3

  # 智谱 Embedding 模型
  embedding:
    api-key: ${QRZHIPUKEY}
    model-name: embedding-3

  # PGVector 向量存储
  vector-store:
    host: localhost
    port: 5432
    database: infopilot
    username: postgres
    password: ${DB_PASSWORD:postgres}
    table: embeddings

# LangChain4j 日志（开发阶段开启）
logging:
  level:
    dev.langchain4j: DEBUG
