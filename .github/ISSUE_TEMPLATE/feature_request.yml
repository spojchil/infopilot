name: 功能请求
description: 提议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: 需求背景
      description: 描述你的使用场景，为什么需要这个功能
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望的方案
      description: 描述你期望的功能是什么样的
  - type: textarea
    attributes:
      label: 备选方案
      description: 你考虑过的其他实现方式
