name: Bug 报告
description: 提交缺陷报告
labels: [bug]
body:
  - type: textarea
    attributes:
      label: 问题描述
      description: 清晰描述你遇到的问题
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 列出复现该问题的步骤
      placeholder: |
        1. 上传一个 xxx 格式的文档
        2. 输入问题 "xxx"
        3. 观察到的错误是...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望行为
      description: 你期望发生什么
  - type: textarea
    attributes:
      label: 环境信息
      description: |
        - OS: [e.g. Windows 11]
        - Java 版本: [e.g. 21.0.2]
        - 项目版本/commit:
