<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfoPilot</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
header { background: #1a1a2e; color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 17px; font-weight: 600; }
header .badge { font-size: 10px; background: #e94560; padding: 2px 8px; border-radius: 10px; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #e0e0e0; }
.toolbar button, .toolbar label.file-btn { padding: 5px 12px; border: 1px solid #d0d0d0; border-radius: 5px; background: #fff; cursor: pointer; font-size: 12px; color: #333; transition: all .15s; }
.toolbar button:hover, .toolbar label.file-btn:hover { background: #f0f0f0; }
.toolbar button.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
.toolbar .sep { flex: 1; }
.toolbar input[type="file"] { display: none; }
#uploadStatus { font-size: 11px; color: #888; }
#chat { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: #1a1a2e; color: #fff; }
.msg.ai { align-self: flex-start; background: #fff; border: 1px solid #e0e0e0; }
footer { padding: 10px 16px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; }
footer input { flex: 1; padding: 10px 12px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 14px; outline: none; }
footer input:focus { border-color: #1a1a2e; }
footer button { padding: 10px 18px; background: #1a1a2e; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
footer button:hover { background: #16213e; }
footer button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<header>
    <h1>InfoPilot</h1>
    <span id="modeBadge" class="badge">对话</span>
</header>

<div class="toolbar">
    <button id="btnChat" class="active" onclick="setMode('chat')">💬 对话</button>
    <button id="btnRag" onclick="setMode('rag')">🔍 RAG 搜索</button>
    <span class="sep"></span>
    <button onclick="newChat()">＋ 新对话</button>
    <label class="file-btn" for="fileInput">📎 上传文档</label>
    <input type="file" id="fileInput" onchange="uploadDoc()" accept=".pdf,.docx,.txt,.md,.html">
    <span id="uploadStatus"></span>
</div>

<div id="chat"></div>

<footer>
    <input id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">发送</button>
</footer>

<script>
let mode = 'chat';
let sessionId = 's-' + Date.now();

function newChat() {
    sessionId = 's-' + Date.now();
    document.getElementById('chat').innerHTML = '';
}

function setMode(m) {
    mode = m;
    document.getElementById('btnChat').classList.toggle('active', m === 'chat');
    document.getElementById('btnRag').classList.toggle('active', m === 'rag');
    document.getElementById('modeBadge').textContent = m === 'chat' ? '对话' : 'RAG 搜索';
}

function uploadDoc() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return;
    const st = document.getElementById('uploadStatus');
    st.textContent = '上传中...';
    const fd = new FormData();
    fd.append('file', file);
    fetch('/api/document/upload', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(d => { st.textContent = d.success ? '✅ ' + d.data : '❌ 失败'; })
        .catch(() => { st.textContent = '❌ 网络错误'; });
}

function send() {
    const input = document.getElementById('msgInput');
    const msg = input.value.trim();
    if (!msg) return;

    addMsg('user', msg);
    input.value = '';
    document.getElementById('sendBtn').disabled = true;

    if (mode === 'chat') {
        sendStream(msg);
    } else {
        sendRag(msg);
    }
}

function sendStream(msg) {
    const container = addMsg('ai', '');
    fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, sessionId: sessionId })
    })
    .then(r => {
        if (!r.ok) throw new Error(r.status);
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        function pump() {
            return reader.read().then(({ done, value }) => {
                if (done) { document.getElementById('sendBtn').disabled = false; return; }
                const text = decoder.decode(value, { stream: true });
                // SSE format: "data:token\n\n"
                const lines = text.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        container.textContent += line.slice(5);
                    }
                }
                return pump();
            });
        }
        return pump();
    })
    .catch(() => {
        container.textContent = '网络错误';
        document.getElementById('sendBtn').disabled = false;
    });
}

function sendRag(msg) {
    const container = addMsg('ai', '');
    fetch('/api/document/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ q: msg })
    })
    .then(r => r.json())
    .then(d => {
        container.textContent = d.success ? d.data : '错误';
        document.getElementById('sendBtn').disabled = false;
    })
    .catch(() => {
        container.textContent = '网络错误';
        document.getElementById('sendBtn').disabled = false;
    });
}

function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    document.getElementById('chat').appendChild(div);
    div.scrollIntoView({ behavior: 'smooth' });
    return div;
}
</script>
</body>
</html>
